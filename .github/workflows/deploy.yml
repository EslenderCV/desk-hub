name: Deploy Desk Hub Stack

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'firmware/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'mood'
        type: choice
        options:
          - mood
          - pi

# Explicitly scope minimal GITHUB_TOKEN permissions (Least Privilege)
permissions:
  contents: read

# Prevent race conditions by cancelling in-flight deployments on duplicate pushes
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # MOOD SERVER DEPLOYMENT (Default target)
  # Runs on MOOD server's dedicated x64 self-hosted runner
  # ============================================================
  deploy-mood:
    name: Build & Deploy to MOOD Server
    if: ${{ github.event.inputs.target != 'pi' }}
    runs-on: [self-hosted, linux, mood]

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          clean: true

      - name: 🛠️ Validate Docker Compose Config
        run: |
          cd infrastructure
          docker compose -f docker-compose.mood.yml config --quiet
        shell: bash

      - name: 🌐 Ensure Appwrite Network Exists
        run: |
          docker network inspect appwrite >/dev/null 2>&1 || {
            echo "⚠️  Appwrite network not found — creating bridge placeholder"
            docker network create appwrite
          }
        shell: bash

      - name: 🚀 Rebuild & Deploy Containers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cd infrastructure
          docker compose -f docker-compose.mood.yml \
            up -d --build --remove-orphans
        shell: bash

      - name: ✅ Verify Container Health
        run: |
          echo "### 🏥 Container Health Status" >> $GITHUB_STEP_SUMMARY
          sleep 15
          docker compose -f infrastructure/docker-compose.mood.yml ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}" | tee -a $GITHUB_STEP_SUMMARY
        shell: bash

      - name: 🧹 Prune Unused Docker Images
        if: always()
        run: |
          docker image prune -f
        shell: bash

      - name: 📝 Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** MOOD Server" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        shell: bash

  # ============================================================
  # RASPBERRY PI DEPLOYMENT (Manual fallback)
  # Runs on Raspberry Pi ARM64 self-hosted runner
  # ============================================================
  deploy-pi:
    name: Build & Deploy to Raspberry Pi
    if: ${{ github.event.inputs.target == 'pi' }}
    runs-on: [self-hosted, linux, ARM64]

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          clean: true

      - name: 🛠️ Validate Docker Compose Config
        run: |
          cd infrastructure
          docker compose -f docker-compose.yml config --quiet
        shell: bash

      - name: 🚀 Rebuild & Deploy Containers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cd infrastructure
          docker compose -f docker-compose.yml up -d --build
        shell: bash

      - name: 🧹 Prune Unused Docker Images
        if: always()
        run: |
          docker image prune -f
        shell: bash

      - name: 📝 Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Raspberry Pi" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        shell: bash