name: Deploy Desk Hub Stack

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'firmware/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'mood'
        type: choice
        options:
          - mood
          - pi

# Explicitly scope minimal GITHUB_TOKEN permissions (Least Privilege)
permissions:
  contents: read

# Prevent race conditions by cancelling in-flight deployments on duplicate pushes
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Stack
    runs-on: [self-hosted, linux]

    env:
      # Default to MOOD server compose; Pi workflow can override
      COMPOSE_FILE: docker-compose.mood.yml

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          clean: true

      - name: 🔍 Detect Deployment Target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'mood' }}"
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          if [ "$TARGET" = "pi" ]; then
            echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
          else
            echo "compose_file=docker-compose.mood.yml" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: 🛠️ Validate Docker Compose Config
        run: |
          cd infrastructure
          docker compose -f ${{ steps.target.outputs.compose_file }} config --quiet
        shell: bash

      - name: 🌐 Ensure Appwrite Network Exists
        if: steps.target.outputs.target == 'mood'
        run: |
          docker network inspect appwrite >/dev/null 2>&1 || {
            echo "⚠️  Appwrite network not found — creating bridge placeholder"
            docker network create appwrite
          }
        shell: bash

      - name: 🚀 Rebuild & Deploy Containers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cd infrastructure
          docker compose -f ${{ steps.target.outputs.compose_file }} \
            up -d --build --remove-orphans
        shell: bash

      - name: ✅ Verify Container Health
        if: steps.target.outputs.target == 'mood'
        run: |
          echo "### 🏥 Container Health Status" >> $GITHUB_STEP_SUMMARY
          sleep 15
          docker compose -f infrastructure/${{ steps.target.outputs.compose_file }} ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}" | tee -a $GITHUB_STEP_SUMMARY
        shell: bash

      - name: 🧹 Prune Unused Docker Images
        if: always()
        run: |
          docker image prune -f
        shell: bash

      - name: 📝 Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ steps.target.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Compose:** \`${{ steps.target.outputs.compose_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        shell: bash