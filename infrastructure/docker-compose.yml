version: '3.8'

services:
  # Phase 1 & 3: Local Gateway & Portfolio Proxy
  web_gateway:
    image: nginx:alpine
    container_name: web_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped

  hub_api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - WS_PORT=8080
      - MQTT_BROKER_URL=mqtt://mqtt_broker:1883
    
  portfolio_app:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: unless-stopped

  # Phase 2: Central Event Stream Telemetry (MQTT)
  mqtt_broker:
    image: eclipse-mosquitto:alpine
    container_name: mqtt_broker
    ports:
      - "1883:1883"  # MQTT unencrypted local port
      - "9001:9001"  # MQTT over WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
    restart: unless-stopped
  
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'America/Santo_Domingo'
      WEBPASSWORD: 'Eslender45'
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
