services:
  # Phase 1 & 3: Local Gateway & Portfolio Proxy
  web_gateway:
    image: nginx:alpine
    container_name: web_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    networks:
      - desk_network
  
  jarvis_ai:
    build:
      context: ../jarvis
      dockerfile: Dockerfile
    container_name: jarvis_ai
    restart: always
    environment:
      - MQTT_BROKER_URL=mqtt://mqtt_broker:1883
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - MAPS_API_KEY=${MAPS_API_KEY}
    depends_on:
      - mqtt_broker
    networks:
      - desk_network

  hub_api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hub_api
    ports:
      - "8081:8080"
    environment:
      - WS_PORT=8080
      - MQTT_BROKER_URL=mqtt://mqtt_broker:1883
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mqtt_broker
    networks:
      - desk_network
    restart: unless-stopped
    
  portfolio_app:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: unless-stopped
    networks:
      - desk_network

  # Phase 2: Central Event Stream Telemetry (MQTT)
  mqtt_broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - desk_network
  
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:80/tcp" # Changed from 8080 to 8082 to avoid collision with hub_api
    environment:
      TZ: 'America/Santo_Domingo'
      WEBPASSWORD: 'Eslender45'
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
    networks:
      - desk_network

# Top-level network declaration
networks:
  desk_network:
    driver: bridge