# ------------------------------------
# Main Web Asset & Dashboard (eslender.dev)
# ------------------------------------
server {
    listen 80;
    server_name eslender.dev www.eslender.dev localhost;

    # 1. Root Domain -> Portfolio App
    location / {
        proxy_pass http://portfolio_app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Desk Hub Operations Dashboard
    location /dashboard {
        proxy_pass http://portfolio_app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Secure WebSocket Route for Hub API Telemetry
    location /ws {
        proxy_pass http://hub_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. REST API Route
    location /api/ {
        proxy_pass http://hub_api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ------------------------------------
# Subdomain: jarvis.eslender.dev
# ------------------------------------
server {
    listen 80;
    server_name jarvis.eslender.dev;

    location / {
        # Route directly to jarvis_ai container
        proxy_pass http://jarvis_ai:8080; 
        proxy_http_version 1.1;

        # WebSocket & Audio/Text Stream Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so real-time responses stream smoothly
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}