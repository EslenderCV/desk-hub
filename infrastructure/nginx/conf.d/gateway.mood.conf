# ====================================================================
# MOOD SERVER NGINX GATEWAY
# Serves static frontend, proxies API/WS/Jarvis to internal services
# ====================================================================

# ------------------------------------
# Health check endpoint
# ------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # Nginx health check for Docker healthcheck
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Fallback: redirect to main site
    location / {
        return 301 $scheme://eslender.dev$request_uri;
    }
}

# ------------------------------------
# Main Web Asset & Dashboard (eslender.dev)
# ------------------------------------
server {
    listen 80;
    server_name eslender.dev www.eslender.dev;

    # 1. Root Domain -> Static Portfolio App (from shared volume)
    location / {
        root /usr/share/nginx/html/app;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 2. Desk Hub Operations Dashboard
    location /dashboard {
        root /usr/share/nginx/html/app;
        try_files $uri $uri.html /dashboard.html /index.html;
    }

    # 3. WebSocket Route for Hub API Telemetry
    location /ws {
        proxy_pass http://hub_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. REST API Route
    location /api/ {
        proxy_pass http://hub_api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------
# Subdomain: jarvis.eslender.dev
# ------------------------------------
server {
    listen 80;
    server_name jarvis.eslender.dev;

    location / {
        proxy_pass http://jarvis_ai:8000;
        proxy_http_version 1.1;

        # WebSocket & Audio/Text Stream Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time streaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
